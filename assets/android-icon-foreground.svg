<?xml version="1.0" encoding="utf-8"?>
<svg id="sumerios-icon" viewBox="-256 -256 1536 1536" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Background Gradient: Emerald to Deep Blue -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#1E3A8A"/>
        </linearGradient>

        <!-- Green Card Gradient -->
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#34D399"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>

        <!-- Arrow Gradient -->
        <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#059669"/>
            <stop offset="100%" stop-color="#34D399"/>
        </linearGradient>

        <!-- Drop shadow for the wallet base and coin -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
        </filter>

        <!-- Soft shadow for the chart arrow -->
        <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- REMOVED Background Squircle so it's transparent! -->
    
    <!-- 2. Green Credit Card (Sticking out of the wallet) -->
    <rect x="290" y="250" width="440" height="200" rx="30" fill="url(#cardGrad)" stroke="#0F172A" stroke-width="12"/>
    <rect x="330" y="300" width="100" height="60" rx="15" fill="#F8FAFC" opacity="0.3"/>

    <!-- 3. Wallet Back/Base (Deep Blue for depth) -->
    <rect x="180" y="360" width="664" height="420" rx="60" fill="#0F172A" filter="url(#shadow)"/>

    <!-- 4. Wallet Front (White) -->
    <rect x="180" y="340" width="664" height="420" rx="60" fill="#F8FAFC"/>

    <!-- Wallet detail line (gives it a folded/opening look) -->
    <path d="M 180 430 Q 512 480 844 430" fill="none" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round"/>

    <!-- 5. Chart Arrow (Rising Emerald Green) -->
    <g filter="url(#lightShadow)">
        <!-- Arrow path -->
        <path d="M 160 700 L 410 450 L 550 590 L 800 310" fill="none" stroke="url(#arrowGrad)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Arrow Head (polygon precisely at the end of the path) -->
        <polygon points="730,290 865,240 815,380" fill="#34D399" stroke="#34D399" stroke-width="16" stroke-linejoin="round"/>
    </g>

    <!-- 6. Coin (Overlapping bottom right) -->
    <g filter="url(#shadow)">
        <!-- Outer Deep Blue border -->
        <circle cx="760" cy="680" r="140" fill="#0F172A"/>
        <!-- Inner Emerald Green fill -->
        <circle cx="760" cy="680" r="120" fill="url(#cardGrad)"/>
        <!-- Subtle inner ring detail -->
        <circle cx="760" cy="680" r="95" fill="none" stroke="#064E3B" stroke-width="8" opacity="0.5"/>
        <!-- Dollar Sign -->
        <text x="760" y="735" font-family="system-ui, -apple-system, sans-serif" font-size="150" font-weight="900" fill="#0F172A" text-anchor="middle">$</text>
    </g>
</svg>
